name: 🏁 Windows Production Builds
on:
  workflow_call:

# Global Settings
# SCONS_CACHE for windows must be set in the build environment
env:
  # Used for the cache key. Add version suffix to force clean build.
  GODOT_BASE_BRANCH: 4.4
  SCONS_FLAGS: module_text_server_fb_enabled=yes d3d12=yes strict_checks=yes "angle_libs=${{ github.workspace }}/" production=yes
  SCONS_CACHE_MSVC_CONFIG: true

jobs:
  build-windows:
    # Windows 10 with latest image
    runs-on: windows-latest
    name: ${{ matrix.name }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Editor (target=editor, tests=yes)
            cache-name: windows-editor
            target: editor
            # Skip debug symbols, they're way too big with MSVC.
            scons-flags: debug_symbols=no vsproj=yes vsproj_gen_only=no
            bin: ./bin/godot.windows.editor.x86_64.exe
            build-mono: false
            compiler: msvc

          - name: Template, release (target=template_release, tests=yes)
            cache-name: windows-template-release
            target: template_release
            scons-flags: debug_symbols=no
            bin: ./bin/godot.windows.template_release.x86_64.exe
            build-mono: false
            compiler: msvc

          # - name: Template, debug (target=template_debug, tests=yes)
          #   cache-name: windows-template-debug
          #   target: template_debug
          #   scons-flags: debug_symbols=no
          #   bin: ./bin/godot.windows.template_debug.x86_64.exe
          #   compiler: msvc

          - name: Editor w/ Mono (target=editor, tests=yes)
            cache-name: windows-editor-mono
            target: editor
            # Skip debug symbols, they're way too big with MSVC.
            scons-flags: debug_symbols=no vsproj=yes vsproj_gen_only=no module_mono_enabled=yes
            bin: ./bin/godot.windows.editor.x86_64.mono.exe
            build-mono: true
            compiler: msvc

          - name: Template w/ Mono, release (target=template_release, tests=yes)
            cache-name: windows-template-mono-release
            target: template_release
            scons-flags: debug_symbols=no module_mono_enabled=yes
            bin: ./bin/godot.windows.template_release.x86_64.mono.exe
            build-mono: false
            compiler: msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download Direct3D 12 SDK components
        run: python ./misc/scripts/install_d3d12_sdk_windows.py

      - name: Download pre-built ANGLE static libraries
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: godotengine/godot-angle-static
          version: tags/chromium/6601.2
          file: godot-angle-static-x86_64-${{ matrix.compiler == 'gcc' && 'gcc' || 'msvc' }}-release.zip
          target: angle/angle.zip

      - name: Extract pre-built ANGLE static libraries
        run: Expand-Archive -Force angle/angle.zip ${{ github.workspace }}/

      - name: Setup older .NET SDK as baseline
        if: matrix.build-mono
        uses: actions/setup-dotnet@v4
        with:
          # Targeting the oldest version we want to support to ensure it still builds.
          dotnet-version: 8.0.100

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ matrix.scons-flags }}
          platform: windows
          target: ${{ matrix.target }}

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Generate C# glue
        if: matrix.build-mono
        run: |
          ${{ matrix.bin }} --headless --generate-mono-glue ./modules/mono/glue

      - name: Build .NET solutions
        if: matrix.build-mono
        run: |
          dotnet --info
          ./modules/mono/build_scripts/build_assemblies.py --godot-output-dir=./bin --godot-platform=windows --werror

      - name: Prepare artifact
        if: matrix.compiler == 'msvc'
        run: |
          Remove-Item bin/* -Include *.exp,*.lib,*.pdb -Force

      - name: Upload artifact
        if: matrix.compiler == 'msvc'
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ matrix.cache-name }}

      # - name: Unit tests
      #   run: |
      #     ${{ matrix.bin }} --version
      #     ${{ matrix.bin }} --help
      #     ${{ matrix.bin }} --test --force-colors
